name: Validation PMK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Audit, régression et paquets
    # Playwright qualifie explicitement Ubuntu 24.04. Ne pas suivre la
    # migration automatique de ubuntu-latest vers Ubuntu 26 sans recette.
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances de test
        working-directory: tests
        run: npm ci

      - name: Auditer les dépendances npm au niveau élevé
        working-directory: tests
        run: npm audit --audit-level=high

      - name: Installer Chromium pour Playwright
        working-directory: tests
        run: |
          npx playwright install --with-deps chromium
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "PMK_CHROMIUM_PATH=" + require("playwright").chromium.executablePath() + "\n")'

      - name: Auditer les déclarations et la syntaxe
        working-directory: tests
        run: npm run audit

      - name: Vérifier l'absence de dépendance Firebase dans le plugin
        run: python3 tests/firebase-free.py

      - name: Contrôler les données publiables
        run: python3 tests/publication-safety.py

      - name: Vérifier les règles durables du dépôt
        run: python3 tests/repo-policy.py

      - name: Exécuter les 79 groupes de régression
        working-directory: tests
        run: npm test

      - name: Contrôles Perl du toolkit KTD
        run: prove -v t/00-boundaries.t t/02-ktd-toolkit.t t/03-migration-request.t

      - name: Perl::Critic au niveau stern sur le point d’entrée
        run: |
          sudo apt-get update
          sudo apt-get install -y libperl-critic-perl
          perlcritic --severity 4 --verbose 8 \
            plugin/Koha/Plugin/PimpMyKoha.pm \
            t/00-boundaries.t \
            t/01-metadata.t \
            t/02-ktd-toolkit.t

      - name: Construire les deux canaux du plugin
        run: |
          python3 plugin/build.py \
            --channel stable \
            --stage "$RUNNER_TEMP/pmk-stable" \
            --output "$RUNNER_TEMP/PimpMyKoha-stable.kpz"
          python3 plugin/build.py \
            --channel preview \
            --stage "$RUNNER_TEMP/pmk-preview" \
            --output "$RUNNER_TEMP/PimpMyKoha-preview.kpz"

      - name: Contrôler les paquets construits
        run: |
          python3 tests/publication-safety.py \
            "$RUNNER_TEMP/PimpMyKoha-stable.kpz" \
            "$RUNNER_TEMP/PimpMyKoha-preview.kpz"
          python3 tests/release-channels.py \
            "$RUNNER_TEMP/PimpMyKoha-stable.kpz" \
            "$RUNNER_TEMP/PimpMyKoha-preview.kpz"

      - name: Publier les paquets de contrôle
        uses: actions/upload-artifact@v7
        with:
          name: pmk-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/PimpMyKoha-stable.kpz
            ${{ runner.temp }}/PimpMyKoha-preview.kpz

